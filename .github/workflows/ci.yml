name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  ci:
    name: Build, Lint, and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        uses: actions/checkout@v4

      - name: Setup Node.js
        # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Check Code Formatting (Prettier)
        run: npm run format || echo "Prettier failed. Please run 'npm run format' locally and commit the changes."

      - name: Run Linter (ESLint)
        run: npm run lint

      - name: Check Types (TypeScript)
        run: npm run typecheck

      - name: Run Unit Tests with Coverage
        run: npm run test:cov

      - name: Run e2e Tests
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/test_db?schema=public
          DIRECT_URL: postgresql://postgres:password@localhost:5432/test_db?schema=public
          JWT_SECRET: test-secret
          RABBITMQ_URL: amqp://localhost:5672
          PORT: 3000
        run: |
          npx prisma db push --accept-data-loss
          npm run build
          node dist/src/main.js &
          echo "Waiting for server to be ready..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health && break
            echo "Attempt $i: server not ready, retrying in 2s..."
            sleep 2
          done
          npm run test:e2e

      - name: Build Application
        run: npm run build


  semgrep:
    name: SAST Scan (Semgrep)
    runs-on: ubuntu-latest
    steps:
      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: docker run --rm -v "${PWD}:/src" returntocorp/semgrep semgrep scan --config auto --error
